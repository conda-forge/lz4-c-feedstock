schema_version: 1

context:
  pkg_name: lz4-c
  name: lz4
  version: "1.10.0"

recipe:
  name: ${{ pkg_name }}
  version: ${{ version }}

source:
  url: https://github.com/${{ name }}/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b

build:
  number: 2

outputs:
  - package:
      name: lz4-c
    build:
      script:
        file: ${{ 'build.sh' if unix else 'build.bat' if win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: not win
          then: ${{ compiler('cxx') }}
        - if: not win
          then: make
        - if: win
          then: cmake
        - if: win
          then: ninja
        - if: unix
          then: patch
      # https://abi-laboratory.pro/index.php?view=timeline&l=lz4
      run_exports:
        - ${{ pin_subpackage(pkg_name, upper_bound='x.x') }}
    tests:
      - package_contents:
          include:
            - lz4.h
            - lz4hc.h
            - lz4frame.h
          lib:
            - lz4
          files:
            exists:
              - if: unix
                then: lib/pkgconfig/liblz4.pc
            not_exists:
              - if: unix
                then: lib/liblz4.a
              - if: win
                then: Library/lib/liblz4_static.lib
      - files:
          recipe:
            - test_shared_cmake
        requirements:
          run:
            - if: not (linux and riscv64)
              then: pkg-config
            - if: win
              then: ${{ compiler('c') }}
            - if: win
              then: ${{ stdlib('c') }}
            - if: win
              then: cmake
            - if: win
              then: ninja
        script:
          - lz4 -h
          - if: unix
            then: lz4c -h
          - if: unix
            then: lz4cat -h
          - if: unix
            then: unlz4 -h
          - if: not (linux and riscv64)
            then: pkg-config --cflags --libs liblz4
          - if: win
            then: pushd test_shared_cmake
          - if: win
            then: cmake -GNinja .
          - if: win
            then: popd
  - package:
      name: lz4-c-static
    build:
      always_include_files:
        - if: win
          then: Library/lib/cmake/lz4
      script:
        file: ${{ 'build_static.sh' if unix else 'bld_static.bat' if win else '' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: not win
          then: ${{ compiler('cxx') }}
        - if: not win
          then: make
        - if: win
          then: cmake
        - if: win
          then: ninja
      host:
        - ${{ pin_subpackage('lz4-c', exact=True) }}
      run:
        - ${{ pin_subpackage('lz4-c', exact=True) }}
    tests:
      - package_contents:
          files:
            exists:
              - if: unix
                then: lib/liblz4.a
              - if: win
                then: Library/lib/lz4_static.lib
      - files:
          recipe:
            - test_static_cmake
        requirements:
          run:
            - if: win
              then: ${{ compiler('c') }}
            - if: win
              then: ${{ stdlib('c') }}
            - if: win
              then: cmake
            - if: win
              then: ninja
        script:
          - if: win
            then: pushd test_static_cmake
          - if: win
            then: cmake -GNinja .
          - if: win
            then: popd

about:
  license: BSD-2-Clause
  license_file: lib/LICENSE
  summary: Extremely Fast Compression algorithm
  description: |
    LZ4 is lossless compression algorithm, providing compression speed at 400
    MB/s per core (0.16 Bytes/cycle). It features an extremely fast decoder,
    with speed in multiple GB/s per core (0.71 Bytes/cycle). A high compression
    derivative, called LZ4_HC, is available, trading customizable CPU time for
    compression ratio. LZ4 library is provided as open source software using a
    BSD license.


  homepage: https://www.lz4.org
  repository: https://github.com/lz4/lz4

extra:
  recipe-maintainers:
    - mingwandroid
    - rmax
    - wesm
    - xhochy
